name: Build FreeLing es-CL packages

# FreeLing 4.2 with FreeLing es-CL 2027, built from FreeLing's source on each
# distribution, in that distribution's own container, so that the program
# is linked against its own Boost and ICU. Each package is then installed in
# a fresh container of the same distribution and checked
# (packaging/test-freeling.sh); only checked packages are attached to a
# release. The package release is the release's tag, which must be a date,
# YYMMDD, with an optional letter for a second release that day (261112,
# 261112b); a run started by hand makes test packages, 0.<run number>, which
# sort before every release. macOS (Apple silicon and Intel) gets a
# tarball instead of a package: FreeLing built against Homebrew's Boost and
# ICU, installed in /usr/local/freeling-es-cl-2027, checked on the machine
# that built it and attached to the release. Windows (x86-64) gets a zip:
# FreeLing built with MSYS2's UCRT64 toolchain, with the libraries it needs
# beside its programs, checked where it was built and again unpacked
# elsewhere through analyze.bat. Run by hand with
# "test only" set to the number of an earlier run, only the checks are run,
# on that run's packages.

on:
  push:
    branches: [windows-package-test]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_only:
        description: "Test only: the run whose packages to check (empty: build them)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  # Nothing is built if any file of the repository, or the last commit's
  # author, committer or message, holds one of the terms in the repository
  # secret PRIVATE_TERMS (one per line, not case-sensitive). Only file names
  # and counts are printed, never the terms. Without the secret the check is
  # skipped.
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for private information
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: |
          if [ -z "$PRIVATE_TERMS" ]; then
            echo "The secret PRIVATE_TERMS is not set: check skipped."
            exit 0
          fi
          terms="$RUNNER_TEMP/terms"
          printf '%s\n' "$PRIVATE_TERMS" | tr -d '\r' | sed '/^[[:space:]]*$/d' > "$terms"
          found=0
          files=0
          while IFS= read -r f; do
            files=$((files + 1))
            n=$(grep -c -I -i -F -f "$terms" -- "$f" || true)
            if [ "${n:-0}" -gt 0 ]; then
              echo "PRIVATE INFORMATION: $n line(s) in $f"
              found=1
            fi
          done < <(git ls-files)
          n=$(git log -1 --format='%an%n%ae%n%cn%n%ce%n%B' | grep -c -i -F -f "$terms" || true)
          if [ "${n:-0}" -gt 0 ]; then
            echo "PRIVATE INFORMATION: $n line(s) in the last commit's author, committer or message"
            found=1
          fi
          if [ "$found" -eq 0 ]; then
            echo "No private terms in $files files or in the last commit."
          fi
          exit "$found"

  build:
    needs: privacy
    if: inputs.test_only == ''
    strategy:
      fail-fast: false
      matrix:
        # id: the name of its artifact; image: the distribution's container;
        # family: how its tools are installed (dnf or apt); packager: nfpm's
        # package format; suffix: the distribution's part of the package
        # release; extra: the package of the en_US.UTF-8 locale, FreeLing's
        # default.
        include:
          - image: fedora:44
            id: fedora44
            family: dnf
            packager: rpm
            suffix: .fc44
            extra: glibc-langpack-en
          - image: fedora:43
            id: fedora43
            family: dnf
            packager: rpm
            suffix: .fc43
            extra: glibc-langpack-en
          - image: debian:13
            id: debian13
            family: apt
            packager: deb
            suffix: "~debian13"
            extra: locales
          - image: ubuntu:24.04
            id: ubuntu2404
            family: apt
            packager: deb
            suffix: "~ubuntu24.04"
            extra: locales
          - image: ubuntu:26.04
            id: ubuntu2604
            family: apt
            packager: deb
            suffix: "~ubuntu26.04"
            extra: locales
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Install the build tools
        run: |
          if [ "${{ matrix.family }}" = dnf ]; then
            dnf -y -q install git gcc-c++ make cmake zlib-devel libicu-devel boost-devel \
              patch file binutils findutils curl tar gzip which diffutils python3 rpm \
              glibc-langpack-en glibc-langpack-es glibc-langpack-pt
          else
            export DEBIAN_FRONTEND=noninteractive
            apt-get -qq update
            apt-get -y -qq install git build-essential cmake zlib1g-dev libicu-dev \
              libboost-regex-dev libboost-filesystem-dev libboost-thread-dev \
              libboost-program-options-dev patch file binutils curl ca-certificates \
              python3 locales > /dev/null
            # FreeLing runs in en_US.UTF-8 (its "default" locale), also
            # while its install builds the phonetic dictionaries.
            for l in en_US es_ES pt_PT; do localedef -i $l -f UTF-8 $l.UTF-8; done
          fi

      - uses: actions/checkout@v5

      - name: Get FreeLing 4.2's source
        run: curl -fsSL -o FreeLing-src-4.2.tar.gz https://github.com/TALP-UPC/FreeLing/releases/download/4.2/FreeLing-src-4.2.tar.gz

      - name: Build FreeLing 4.2 with FreeLing es-CL 2027
        run: REMOVE_TARBALL=yes packaging/build-freeling.sh FreeLing-src-4.2.tar.gz

      - name: Make the package
        run: |
          base=https://github.com/goreleaser/nfpm/releases/download/v2.47.0
          tarball=nfpm_2.47.0_Linux_x86_64.tar.gz
          curl -fsSL -o "$tarball" "$base/$tarball"
          curl -fsSL -o nfpm-checksums.txt "$base/checksums.txt" || curl -fsSL -o nfpm-checksums.txt "$base/nfpm_2.47.0_checksums.txt"
          grep " $tarball\$" nfpm-checksums.txt | sha256sum -c
          tar xzf "$tarball" nfpm
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            rel="0.${{ github.run_number }}"
          elif printf '%s' "$tag" | grep -qE '^[0-9]{6}[a-z]?$'; then
            rel="$tag"
          else
            echo "The release tag must be a date, YYMMDD, with an optional letter (261112, 261112b): $tag"
            exit 1
          fi
          EXTRA_DEPENDS="${{ matrix.extra }}" packaging/make-nfpm-config.py "$rel${{ matrix.suffix }}" > nfpm-run.yaml
          mkdir -p dist
          ./nfpm package --config nfpm-run.yaml --packager ${{ matrix.packager }} --target dist/
          rm -rf pkgroot
          ls -l dist

      - uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.id }}
          path: dist/*
          compression-level: 0

  test:
    needs: build
    if: always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.test_only != ''))
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:44
            id: fedora44
            family: dnf
          - image: fedora:43
            id: fedora43
            family: dnf
          - image: debian:13
            id: debian13
            family: apt
          - image: ubuntu:24.04
            id: ubuntu2404
            family: apt
          - image: ubuntu:26.04
            id: ubuntu2604
            family: apt
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Install git
        run: |
          if [ "${{ matrix.family }}" = dnf ]; then
            dnf -y -q install git binutils
          else
            apt-get -qq update && DEBIAN_FRONTEND=noninteractive apt-get -y -qq install git binutils ca-certificates > /dev/null
          fi

      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          name: package-${{ matrix.id }}
          path: dist
          run-id: ${{ inputs.test_only || github.run_id }}
          github-token: ${{ github.token }}

      - name: Install the package
        run: |
          ls -l dist
          if [ "${{ matrix.family }}" = dnf ]; then
            dnf -y -q install ./dist/*.rpm
          else
            apt-get -y -qq install ./dist/*.deb > /dev/null
          fi

      - name: Check it
        run: packaging/test-freeling.sh

      - name: Attach it to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # macOS: FreeLing 4.2 with FreeLing es-CL 2027, built on GitHub's macOS 15
  # machines (Apple silicon and Intel) against Homebrew's Boost and ICU,
  # installed in /usr/local/freeling-es-cl-2027 and checked there; the
  # tarball of that folder is attached to the release. Installing it needs
  # Homebrew's boost and icu4c (the README, "macOS").
  macos:
    needs: privacy
    if: inputs.test_only == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            id: macos-arm64
          - runner: macos-15-intel
            id: macos-x86_64
    runs-on: ${{ matrix.runner }}
    env:
      PREFIX: /usr/local/freeling-es-cl-2027
    steps:
      - uses: actions/checkout@v5

      - name: Tools and libraries from Homebrew
        run: |
          brew update >/dev/null || true
          brew install boost icu4c cmake gnu-sed coreutils binutils
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix binutils)/bin" >> "$GITHUB_PATH"
          brew list --versions boost icu4c

      - name: Get FreeLing 4.2's source
        run: |
          curl -fsSL -o "$RUNNER_TEMP/FreeLing-src-4.2.tar.gz" https://github.com/TALP-UPC/FreeLing/releases/download/4.2/FreeLing-src-4.2.tar.gz
          echo "f96afbdb000d7375426644fb2f25baff9a63136dddce6551ea0fd20059bfce3b  $RUNNER_TEMP/FreeLing-src-4.2.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/FreeLing-src-4.2.tar.gz" -C "$RUNNER_TEMP"

      - name: The changes of FreeLing es-CL 2027
        run: packaging/patch-freeling.sh "$RUNNER_TEMP/FreeLing-4.2" "$GITHUB_WORKSPACE/software/patches/freeling-4.2-np-classes.patch"

      - name: Build and install FreeLing 4.2
        run: |
          sudo mkdir -p "$PREFIX"
          sudo chown "$(id -u):$(id -g)" "$PREFIX"
          cmake -S "$RUNNER_TEMP/FreeLing-4.2" -B "$RUNNER_TEMP/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DICU_ROOT="$(brew --prefix icu4c)" \
            -DBOOST_ROOT="$(brew --prefix boost)" \
            -DCMAKE_CXX_FLAGS="-Wno-unknown-warning-option -Wno-template-body" \
            -DCMAKE_C_FLAGS="-std=gnu17"
          make -C "$RUNNER_TEMP/build" -j"$(sysctl -n hw.ncpu)" > "$RUNNER_TEMP/build.log" 2>&1 || { tail -200 "$RUNNER_TEMP/build.log"; exit 1; }
          make -C "$RUNNER_TEMP/build" install > "$RUNNER_TEMP/install.log" 2>&1 || { tail -100 "$RUNNER_TEMP/install.log"; exit 1; }

      - name: The Chilean data
        run: packaging/install-data.sh "$PREFIX/share/freeling"

      - name: Check it
        run: packaging/test-freeling.sh

      - name: Make the tarball
        run: |
          tag="${{ github.event.release.tag_name }}"
          [ -n "$tag" ] || tag="0.${{ github.run_number }}"
          mkdir -p "$PREFIX/share/doc/freeling-es-cl"
          cp README.md LICENSE BUILD-REPORT.md CHANGELOG.tsv "$PREFIX/share/doc/freeling-es-cl/"
          mkdir -p dist
          tar -C / -czf "dist/freeling-es-cl-2027-$tag-${{ matrix.id }}.tar.gz" "${PREFIX#/}"
          ls -l dist

      - uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.id }}
          path: dist/*
          compression-level: 0

      - name: Attach it to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # Windows: FreeLing 4.2 with FreeLing es-CL 2027, built on GitHub's Windows
  # machine with MSYS2's UCRT64 toolchain (GCC, Boost, ICU; the Windows fixes
  # of patch-freeling.sh and two build options: Boost linked dynamically,
  # every symbol of each DLL exported), installed into a folder and checked
  # there; the libraries it needs from MSYS2 are copied beside its programs,
  # and the zip of that folder is unpacked elsewhere and checked again
  # through analyze.bat from Windows' own shell, with nothing of MSYS2 on the
  # path, before it is attached to the release.
  windows:
    needs: privacy
    if: inputs.test_only == ''
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Git on Windows turns LF into CRLF at checkout, which changes every data file and fails the release's sha256 sums
      - name: Keep the files' own line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-icu
            mingw-w64-ucrt-x86_64-zlib
            patch curl tar gzip coreutils sed grep diffutils binutils zip

      - name: Get FreeLing 4.2's source
        run: |
          # RUNNER_TEMP is a Windows path (D:\a\_temp), which MSYS2's tar takes for a remote host, so the tarball goes in the workspace
          curl -fsSL -o FreeLing-src-4.2.tar.gz https://github.com/TALP-UPC/FreeLing/releases/download/4.2/FreeLing-src-4.2.tar.gz
          echo "f96afbdb000d7375426644fb2f25baff9a63136dddce6551ea0fd20059bfce3b  FreeLing-src-4.2.tar.gz" | sha256sum -c -
          mkdir -p src
          tar -xzf FreeLing-src-4.2.tar.gz -C src

      - name: The changes of FreeLing es-CL 2027
        run: packaging/patch-freeling.sh "$PWD/src/FreeLing-4.2" "$PWD/software/patches/freeling-4.2-np-classes.patch"

      - name: Build and install FreeLing 4.2
        run: |
          cmake -S src/FreeLing-4.2 -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage/freeling-es-cl-2027" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBoost_USE_STATIC_LIBS=OFF \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--export-all-symbols" \
            -DCMAKE_CXX_FLAGS="-Wno-template-body" \
            -DCMAKE_C_FLAGS="-std=gnu17"
          ninja -C build > build.log 2>&1 || { grep -E "^FAILED|error:|undefined reference" build.log | head -100 || true; tail -40 build.log; exit 1; }
          ninja -C build install > install.log 2>&1 || { tail -60 install.log; exit 1; }

      - name: The Chilean data
        run: packaging/install-data.sh "$PWD/stage/freeling-es-cl-2027/share/freeling"

      - name: Check it
        run: PREFIX="$PWD/stage/freeling-es-cl-2027" packaging/test-freeling.sh

      - name: The libraries from MSYS2, beside the programs
        run: |
          p="$PWD/stage/freeling-es-cl-2027"
          export PATH="$p/lib:$PATH"
          ldd "$p"/bin/*.exe "$p"/lib/*.dll | awk '$3 ~ /^\/ucrt64\/bin\// {print $3}' | sort -u > msys2-dlls.txt
          cat msys2-dlls.txt
          [ -s msys2-dlls.txt ] || { echo "no library of MSYS2 found"; exit 1; }
          xargs -a msys2-dlls.txt cp -t "$p/bin/"

      - name: Make the zip
        run: |
          tag="${{ github.event.release.tag_name }}"
          [ -n "$tag" ] || tag="0.${{ github.run_number }}"
          p=stage/freeling-es-cl-2027
          mkdir -p "$p/share/doc/freeling-es-cl"
          cp README.md LICENSE BUILD-REPORT.md CHANGELOG.tsv "$p/share/doc/freeling-es-cl/"
          mkdir -p dist
          (cd stage && zip -qr "../dist/freeling-es-cl-2027-$tag-windows-x86_64.zip" freeling-es-cl-2027)
          ls -l dist

      - name: Check the zip from Windows' own shell, without MSYS2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\fl"
          $bat = "$env:RUNNER_TEMP\fl\freeling-es-cl-2027\bin\analyze.bat"
          $env:PATH = "C:\Windows\system32;C:\Windows"
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          # -cmatch, not -match: PowerShell's -match ignores case, and the lemma's case is what is checked
          $out = "Cachái que mi vecina, la Javi, no está ni ahí con voh, conchetumare. Dice que soi cuartero y que no te bañai nunca." | & $bat -f es-cl.cfg --outlv tagged --nonec --sense none
          $out
          foreach ($want in @('^Cachái cachar VMIP2SV ', '^no_está_ni_ahí no_estar_ni_ahí VMIP3S0 ', '^voh vos PP2CS0V ', '^conchetumare concha_de_tu_madre I ', '^soi ser VSIP2SV ', '^bañai bañar VMIP2SV ')) {
            if (-not ($out -cmatch $want)) { throw "the Chilean sentences: no line matching $want" }
          }
          $out = "Él llegó a Ñuñoa." | & $bat -f es-cl.cfg --outlv tagged --nonec --sense none
          $out
          if (-not ($out -cmatch '^Él él P')) { throw "Él was not lowercased to él" }
          if (-not ($out -cmatch '^Ñuñoa ñuñoa NP')) { throw "Ñuñoa was not read as the name ñuñoa" }
          $out = "La jente i el rei." | & $bat -f es-cl-19th-century.cfg --outlv tagged --nonec --sense none
          $out
          if (-not ($out -cmatch '^jente gente NCFS000')) { throw "the 19th-century dictionary did not read jente as gente" }
          "ok    the zip works from analyze.bat with nothing of MSYS2 on the path"

      - uses: actions/upload-artifact@v6
        with:
          name: package-windows-x86_64
          path: dist/*
          compression-level: 0

      - name: Attach it to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
